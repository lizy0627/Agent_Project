<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agent_Project | 智能体助手</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/frontend/style.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Agent 工作区侧边栏">
        <section class="brand">
          <div class="brand-mark" aria-hidden="true">AI</div>
          <div class="brand-copy">
            <strong>Agent_Project</strong>
            <span>DashScope Agent</span>
          </div>
        </section>

        <button id="newConversationButton" class="primary-action" type="button">
          <span aria-hidden="true">+</span>
          新建会话
        </button>

        <section class="conversation-section" aria-label="会话列表">
          <div class="section-header">
            <span class="section-label">会话列表</span>
            <span id="conversationCountText" class="section-count">0</span>
          </div>
          <div id="conversationList" class="conversation-list"></div>
        </section>

        <section class="session-card" aria-label="当前会话">
          <div class="section-label">当前会话 ID</div>
          <code id="conversationIdText" class="session-id"></code>
        </section>

        <nav class="mode-menu" aria-label="功能菜单">
          <div class="section-label">能力模式</div>
          <button class="mode-item active" type="button" data-mode="通用助手">
            <span class="mode-icon" aria-hidden="true">?</span>
            通用助手
          </button>
          <button class="mode-item" type="button" data-mode="代码助手">
            <span class="mode-icon" aria-hidden="true">{ }</span>
            代码助手
          </button>
          <button class="mode-item" type="button" data-mode="学习助手">
            <span class="mode-icon" aria-hidden="true">A</span>
            学习助手
          </button>
          <button class="mode-item" type="button" data-mode="面试助手">
            <span class="mode-icon" aria-hidden="true">#</span>
            面试助手
          </button>
        </nav>

        <section class="side-note">
          <span class="online-dot" aria-hidden="true"></span>
          <div>
            <strong>本地开发模式</strong>
            <span>POST http://127.0.0.1:8000/chat</span>
          </div>
        </section>
      </aside>

      <main class="chat-panel">
        <header class="agent-topbar">
          <div class="agent-title">
            <span class="eyebrow">Agent Console</span>
            <h1 id="activeConversationTitle">智能体助手</h1>
          </div>

          <div class="agent-status" aria-label="Agent 状态">
            <div class="status-item">
              <span class="online-dot" aria-hidden="true"></span>
              <span>在线</span>
            </div>
            <div class="status-item">
              <span>模型</span>
              <strong id="currentModelText">等待后端返回</strong>
            </div>
            <div class="status-item">
              <span>模式</span>
              <strong id="currentModeText">通用助手</strong>
            </div>
            <button id="clearConversationButton" class="ghost-button" type="button">清空</button>
          </div>
        </header>

        <section id="messageList" class="message-list" aria-live="polite">
          <div class="welcome-panel">
            <div class="welcome-card">
              <span class="welcome-badge">DashScope Agent 在线</span>
              <h2>你好，我是你的 Agent 智能体助手</h2>
              <p>
                可以帮你解释概念、分析项目、生成代码思路，也能把任务拆成清晰的下一步。
              </p>
              <div class="prompt-grid">
                <button class="prompt-card" type="button">解释一下 /chat 接口从请求到返回的完整流程</button>
                <button class="prompt-card" type="button">帮我把一个复杂任务拆成可执行步骤</button>
                <button class="prompt-card" type="button">检查这段代码可能存在的问题</button>
                <button class="prompt-card" type="button">用简洁中文总结下面这段文字</button>
              </div>
            </div>
          </div>
        </section>

        <button
          id="scrollToBottomButton"
          class="scroll-to-bottom-button is-hidden"
          type="button"
          aria-label="回到底部"
        >
          ↓
        </button>

        <button
          id="newMessageNotice"
          class="new-message-notice is-hidden"
          type="button"
        >
          有新消息，点击查看
        </button>

        <footer class="composer-wrap">
          <form id="chatForm" class="composer">
            <textarea
              id="messageInput"
              class="message-input"
              rows="1"
              maxlength="4000"
              autocomplete="off"
              placeholder="输入问题，Enter 发送，Shift + Enter 换行"
            ></textarea>

            <div class="composer-actions">
              <span id="charCounter" class="char-counter">0 / 4000</span>
              <button id="sendButton" class="send-button" type="submit" disabled>发送</button>
            </div>
          </form>
        </footer>
      </main>
    </div>

    <script src="/frontend/main.js" defer></script>
  </body>
</html>
